<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Product Manager - Freestyle Fiori App</title>
  <style>
    html, body, #content {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f5f6f7;
    }
  </style>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"sap.ui.demo.productmanager": "./"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-onInit="module:sap/ui/core/ComponentSupport">
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div data-sap-ui-component
       data-name="sap.ui.demo.productmanager"
       data-id="container"
       data-settings='{"id" : "sap.ui.demo.productmanager"}'
       style="height: 100%">
  </div>
</body>
</html>
