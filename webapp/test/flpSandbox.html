<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Zone / FLP Sandbox - Product Manager</title>
  <script type="text/javascript">
    window["sap-ushell-config"] = {
      defaultRenderer: "fiori2",
      bootstrapPlugins: {
        "RuntimeAuthoringPlugin": {
          component: "sap.ushell.plugins.rta",
          config: {
            validateAppVersion: false
          }
        }
      },
      renderers: {
        fiori2: {
          componentData: {
            config: {
              enableSearch: false,
              rootIntent: "Product-manage"
            }
          }
        }
      },
      services: {
        "LaunchPage": {
          "adapter": {
            "config": {
              "groups": [{
                "id": "sampleGroup",
                "title": "SAP Build Work Zone - Product Applications",
                "isPreset": true,
                "isVisible": true,
                "isGroupLocked": false,
                "tiles": [{
                  "id": "tileProductManager",
                  "title": "Product Manager",
                  "subTitle": "Freestyle UI5 Fiori",
                  "icon": "sap-icon://product",
                  "tileType": "sap.ushell.ui.tile.StaticTile",
                  "properties": {
                    "targetURL": "#Product-manage",
                    "title": "Product Manager",
                    "subtitle": "Freestyle UI5 Fiori",
                    "icon": "sap-icon://product"
                  }
                }]
              }]
            }
          }
        },
        "ClientSideTargetResolution": {
          "adapter": {
            "config": {
              "inbounds": {
                "Product-manage": {
                  "semanticObject": "Product",
                  "action": "manage",
                  "title": "Product Manager",
                  "signature": {
                    "parameters": {}
                  },
                  "resolutionResult": {
                    "applicationType": "SAPUI5",
                    "additionalInformation": "SAPUI5.Component=sap.ui.demo.productmanager",
                    "url": "../"
                  }
                }
              }
            }
          }
        },
        "NavTargetResolution": {
          "config": {
            "enableClientSideTargetResolution": true
          }
        }
      }
    };
  </script>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"sap.ui.demo.productmanager": "../"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow"
    data-sap-ui-onInit="module:sap/ushell/bootstrap/sandbox">
  </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
